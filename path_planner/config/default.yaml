vehicle:
  mass_kg: 3.0
  drill_mass_kg: 3.5
  forward_flight_power_w: 500.0
  takeoff_power_w: 750.0
  landing_power_w: 400.0
  # Flight powers above are measured/reference values at 3 kg. The aerodynamic
  # share is scaled with the rotorcraft induced-power approximation P ~ m^1.5.
  flight_reference_mass_kg: 3.0
  flight_power_mass_exponent: 1.5
  flight_fixed_power_fraction: 0.10
  ground_electronics_power_w: 15.0
  ground_max_speed_mps: 1.0
  air_max_speed_mps: 2.0
  takeoff_time_s: 3.0
  landing_time_s: 3.0
  max_slope_deg: 15.0
  rolling_resistance_coefficient: 0.08
  roughness_rolling_resistance_gain: 0.35
  drivetrain_efficiency: 0.70
  max_drive_mechanical_power_w: 120.0
  roughness_speed_loss: 0.70
  min_ground_speed_mps: 0.20

batteries:
  reserve_ratio: 0.20
  rover:
    chemistry: LiPo
    series_cells: 6
    nominal_voltage_v: 22.2
    capacity_ah: 2.2
    nominal_energy_wh: 48.84
  drill:
    chemistry: LiPo
    series_cells: 6
    nominal_voltage_v: 22.2
    capacity_ah: 3.3
    nominal_energy_wh: 73.26

aerial:
  cruise_altitude_m: 5.0
  safe_landing_threshold: 5.0

dp:
  connector_step_m: 0.45
  footprint_sample_step_m: 0.4
  max_roll_deg: 12.0
  max_pitch_deg: 12.0
  docking_energy_wh: 0.8
  undocking_energy_wh: 0.2

platform:
  rover_offsets:
    - {x: 0.9, y: 0.9, theta: 0.0}
    - {x: 0.9, y: -0.9, theta: 0.0}
    - {x: -0.9, y: 0.9, theta: 3.141592653589793}
    - {x: -0.9, y: -0.9, theta: 3.141592653589793}
  platform_footprint:
    length_m: 2.6
    width_m: 2.6
  rover_footprint:
    length_m: 0.8
    width_m: 0.6
